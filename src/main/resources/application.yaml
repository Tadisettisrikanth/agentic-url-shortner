spring:
  application:
    name: agentic-url-shortner
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/agentic_url_shortner}
    username: ${DB_USERNAME:agentic}
    password: ${DB_PASSWORD:local-agentic-password}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

agentic:
  execution:
    deterministic: ${AGENTIC_DETERMINISTIC:true}
    max-attempts: ${AGENTIC_MAX_ATTEMPTS:3}
    workspace-root: ${AGENTIC_WORKSPACE_ROOT:./agent-workspaces}
    clarification-token: ${AGENTIC_CLARIFICATION_TOKEN:local-operator-token}
